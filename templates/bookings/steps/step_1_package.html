{% extends 'base.html' %}

{% block content %}
<div class="container section">
    <div class="section-header">
        <h2>Step 1: Select Your Package</h2>
        <p>Choose the cleaning package that best fits your home's size.</p>
    </div>

    <form method="POST" action="{% url 'bookings:step_1_package' %}">
        {% csrf_token %}
        <div class="grid grid--3">
            {% for package in packages %}
            <label class="card" style="display: block; padding: var(--space-6); border: 2px solid {% if selected_package == package.id %}var(--color-primary){% else %}var(--border-color){% endif %}; border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast);">
                <input type="radio" name="package_id" value="{{ package.id }}" class="sr-only" {% if selected_package == package.id %}checked{% endif %} onchange="this.form.submit()">
                <h3 style="margin-bottom: var(--space-2);">{{ package.name }}</h3>
                <p class="text-primary-color font-bold" style="font-size: var(--text-lg);">${{ package.base_price }}</p>
                <p class="text-muted" style="margin-bottom: var(--space-4);">{{ package.approximate_area }}</p>
                <p>{{ package.short_description }}</p>
                <div style="margin-top: var(--space-4); text-align: center;">
                    <span class="badge {% if selected_package == package.id %}badge--accent{% endif %}">
                        {% if selected_package == package.id %}Selected{% else %}Select{% endif %}
                    </span>
                </div>
            </label>
            {% endfor %}
        </div>
        
        <div style="margin-top: var(--space-8); text-align: center;">
            <button type="submit" style="padding: var(--space-3) var(--space-8); background: var(--color-primary); color: white; border: none; border-radius: var(--radius-md); font-weight: bold; cursor: pointer; font-size: var(--text-lg);">Continue to Add-ons &rarr;</button>
        </div>
    </form>
</div>
{% endblock %}
