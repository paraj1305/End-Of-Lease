<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 48" fill="none" width="248" height="48">
  <defs>
    <!-- Shield Container Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2438" />
      <stop offset="100%" stop-color="#0F121F" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Clean Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Upper Wave Gradient -->
    <linearGradient id="crestGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Radiant Gold Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>

    <!-- Text Brand Gradient for 'CLEAN' -->
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- ════════════ EMBLEM: THE DIAMOND BOND SHIELD ════════════ -->
  <g transform="translate(2, 2)" filter="url(#logoShadow)">
    <!-- Shield Outer Body -->
    <path d="M 22 2 C 23.2 2 24.5 2.6 25.4 3.5 L 37.8 12.2 C 39.2 13.2 40 14.7 40 16.4 L 40 24.8 C 40 31.8 33.2 38 23.2 41.5 C 22.4 41.8 21.6 41.8 20.8 41.5 C 10.8 38 4 31.8 4 24.8 L 4 16.4 C 4 14.7 4.8 13.2 6.2 12.2 L 18.6 3.5 C 19.5 2.6 20.8 2 22 2 Z"
          fill="url(#shieldBg)" />
    
    <!-- Shield Highlight Rim -->
    <path d="M 22 3.2 C 22.9 3.2 24 3.7 24.7 4.4 L 37.1 13.1 C 38.2 13.9 38.8 15.1 38.8 16.4 L 38.8 24.8 C 38.8 31.2 32.4 37 22.6 40.3 C 22.2 40.4 21.8 40.4 21.4 40.3 C 11.6 37 5.2 31.2 5.2 24.8 L 5.2 16.4 C 5.2 15.1 5.8 13.9 6.9 13.1 L 19.3 4.4 C 20 3.7 21.1 3.2 22 3.2 Z"
          stroke="url(#shieldBorder)" stroke-width="1.2" fill="none" />

    <!-- Dynamic Clean Wave Swirl (The Pristine Swoop) -->
    <path d="M 10 26 C 14 31 22 33 29 29 C 32 27 34 24 34 24 C 34 24 31 26 26 26 C 19 26 14 22 12 18 C 12 18 10 22 10 26 Z"
          fill="url(#waveGrad)" />

    <!-- Upper Wing Swirl (The Speed Sweep) -->
    <path d="M 13 16 C 17 14 24 14 29 17 C 31 18 32 20 32 20 C 32 20 29 18 24 18 C 19 18 15 20 12 23 L 13 16 Z"
          fill="url(#crestGrad)" />

    <!-- Radiant 4-Point Gold Sparkle Star -->
    <g transform="translate(30, 11)">
      <path d="M 0 -7 C 0.5 -2.2 2.2 -0.5 7 0 C 2.2 0.5 0.5 2.2 0 7 C -0.5 2.2 -2.2 0.5 -7 0 C -2.2 -0.5 -0.5 -2.2 0 -7 Z"
            fill="url(#sparkleGrad)" />
      <circle cx="0" cy="0" r="1.6" fill="#FFFFFF" />
    </g>

    <!-- Ambient Micro Sparkle -->
    <circle cx="12" cy="11" r="1.2" fill="#38BDF8" />
  </g>

  <!-- ════════════ TYPOGRAPHY & WORDMARK ════════════ -->
  <g transform="translate(50, 0)">
    <!-- "FINAL" in Deep Slate Navy -->
    <text x="0" y="27"
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="22"
          font-weight="900"
          letter-spacing="-0.3"
          fill="#0F172A">FINAL</text>

    <!-- "CLEAN" in Royal Electric Blue -->
    <text x="73" y="27"
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="22"
          font-weight="900"
          letter-spacing="-0.3"
          fill="url(#cleanGrad)">CLEAN</text>

    <!-- Sparkle Accent Symbol at end of CLEAN -->
    <path d="M 152 13 C 152.4 15.5 153.8 16.6 156.5 17 C 153.8 17.4 152.4 18.5 152 21 C 151.6 18.5 150.2 17.4 147.5 17 C 150.2 16.6 151.6 15.5 152 13 Z"
          fill="url(#sparkleGrad)" />

    <!-- Subtitle Pill / Authority Descriptor -->
    <text x="1" y="39"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="8"
          font-weight="800"
          letter-spacing="2.2"
          fill="#64748B">END OF LEASE SPECIALISTS</text>
  </g>
</svg>
